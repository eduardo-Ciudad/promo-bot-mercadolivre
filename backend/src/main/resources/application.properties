# src/main/resources/application.properties

spring.application.name=promobot

# WhatsApp Cloud API
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID}
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
whatsapp.api-url=https://graph.facebook.com/v21.0

# Telegram Bot API
telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.api-base-url=https://api.telegram.org
telegram.webhook-secret-token=${TELEGRAM_WEBHOOK_SECRET_TOKEN}

# Outbox / scheduler de envio
outbox.intervalo-scheduler-ms=5000
outbox.tamanho-lote=20
outbox.max-tentativas=5
outbox.backoff-base-segundos=10
outbox.lease-timeout-seconds=120

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/promobot_db}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Mercado Livre - Scraping (Playwright)
mercadolivre.scraping.headless=false
mercadolivre.scraping.base-url-template=https://lista.mercadolivre.com.br/%s/_DisplayType_LF_NoIndex_True
mercadolivre.scraping.categoria-padrao=informatica
mercadolivre.scraping.max-por-categoria=20
mercadolivre.scraping.max-scrolls=10

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=promobot
spring.rabbitmq.password=promobot123


gemini.api-key=${GEMINI_API_KEY}
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
